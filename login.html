<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fokus — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <h2>Fokus</h2>
    <p class="subtitle">Entre na sua conta</p>
    <div class="field">
      <label>Email</label>
      <div class="inp-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg>
        <input type="email" placeholder="seu@email.com">
      </div>
    </div>
    <div class="field">
      <label>Senha</label>
      <div class="inp-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" placeholder="••••••••">
      </div>
    </div>
    <button class="btn-primary full">Entrar</button>
    <p class="auth-switch">Não tem conta? <button onclick="window.location.href='cadastro.html'">Cadastre-se</button></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
