<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="slide-screen">
  <div class="slide-content" style="max-width:600px">

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>

    <div class="slide-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
    </div>

    <div>
      <h2>O que você quer <span class="text-green">organizar?</span></h2>
      <p style="margin-top:8px">Selecione um ou mais. Você pode mudar depois nas configurações.</p>
    </div>

    <div class="category-grid">
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
        <span>Trabalho</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>
        <span>Estudos</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>Saúde</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><path d="M8.56 2.75c4.37 6.03 6.02 9.42 8.03 17.72m2.54-15.38c-3.72 4.35-8.94 5.66-16.88 5.85m19.5 1.9c-3.5-.93-6.63-.82-8.94 0-2.58.92-5.01 2.86-7.44 6.32"/></svg>
        <span>Hobbies</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
        <span>Finanças</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Família</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>Projetos</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M5 17H3a2 2 0 01-2-2V5a2 2 0 012-2h11a2 2 0 012 2v3"/><rect x="9" y="11" width="14" height="10" rx="2"/></svg>
        <span>Viagens</span>
      </div>
      <div class="category-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        <span>Rotina</span>
      </div>
    </div>

    <div class="slide-nav">
      <button class="btn-back-slide" onclick="window.location.href='tela2.html'">← Voltar</button>
      <button class="btn-arrow" id="next3">→</button>
    </div>

  </div>
</div>

<script>
  document.querySelectorAll('.category-card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('selected');
      const selecionados = [...document.querySelectorAll('.category-card.selected')]
        .map(c => c.querySelector('span').textContent);
      localStorage.setItem('interesses', JSON.stringify(selecionados));
      const any = document.querySelector('.category-card.selected');
      document.getElementById('next3').classList.toggle('enabled', !!any);
    });
  });

  document.getElementById('next3').addEventListener('click', () => {
    if (document.getElementById('next3').classList.contains('enabled')) {
      window.location.href = 'tela4.html';
    }
  });
</script>

</body>
</html>
