<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Passo 3</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="slide-screen">

  <div class="slide-content" style="max-width:700px">

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
    </div>

    <div>
      <h2>
        O que você quer
        <span class="text-green">organizar?</span>
      </h2>

      <p>
        Selecione um ou mais interesses.
      </p>
    </div>

    <div class="category-grid">

      <div class="category-card"><span>Trabalho</span></div>
      <div class="category-card"><span>Estudos</span></div>
      <div class="category-card"><span>Saúde</span></div>
      <div class="category-card"><span>Hobbies</span></div>
      <div class="category-card"><span>Finanças</span></div>
      <div class="category-card"><span>Família</span></div>
      <div class="category-card"><span>Projetos</span></div>
      <div class="category-card"><span>Viagens</span></div>
      <div class="category-card"><span>Rotina</span></div>

    </div>

    <div class="slide-nav">

      <button
        class="btn-back"
        onclick="window.location.href='passo2.html'"
      >
        ← Voltar
      </button>

      <button class="btn-next" id="next3">
        Próximo →
      </button>

    </div>

  </div>

</div>

<script>

document.querySelectorAll('.category-card').forEach(card => {

  card.addEventListener('click', () => {

    card.classList.toggle('selected');

    const selecionados = [
      ...document.querySelectorAll('.category-card.selected')
    ].map(c => c.innerText);

    localStorage.setItem(
      'interesses',
      JSON.stringify(selecionados)
    );

    const any =
      document.querySelector('.category-card.selected');

    document
      .getElementById('next3')
      .classList.toggle('enabled', !!any);
  });
});

document.getElementById('next3')
  .addEventListener('click', () => {

    if (
      document
        .getElementById('next3')
        .classList.contains('enabled')
    ) {

      window.location.href = 'passo4.html';
    }
  });

</script>

</body>
</html>
