<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Primeiros Passos</title>
</head>

<body>

  <div class="screen">

    <div class="wrap">

      <div class="dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>

      <div class="icon-ring">
        <i class="ti ti-user"></i>
      </div>

      <div class="titles">
        <h1>
          Como podemos te <em>chamar?</em>
        </h1>

        <p>
          Personalizamos a sua experiência com base no seu nome.
          Pode ser seu apelido, tá bom!
        </p>
      </div>

      <form id="form">

        <label for="nameInp">
          Seu nome
        </label>

        <div class="inp-wrap">

          <i class="ti ti-user"></i>

          <input
            id="nameInp"
            type="text"
            placeholder="Seu nome ou apelido..."
            maxlength="30"
            autocomplete="off"
          >

        </div>

        <button
          class="arrow-btn"
          id="btn"
          type="submit"
          disabled
        >
          <i class="ti ti-arrow-right"></i>
        </button>

      </form>

    </div>

  </div>

</body>
</html>
