<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="slide-screen">
  <div class="slide-content">

    <div class="dots">
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="slide-icon">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0"/>
      </svg>
    </div>

    <div>
      <h2>Como podemos te <em style="color:var(--primary);font-style:italic">chamar?</em></h2>
      <p>Personalizamos a sua experiência com base no seu nome. Pode ser seu apelido, tá bom!</p>
    </div>

    <div class="input-wrap">
      <label for="nome">Seu nome</label>
      <input class="input-name" id="nome" type="text" placeholder="Seu nome ou apelido..." />
    </div>

    <div class="slide-nav">
      <span></span>
      <button class="btn-primary" onclick="proximaTela()">Próximo →</button>
    </div>

  </div>
</div>
<script>
  function proximaTela() {
    const nome = document.getElementById('nome').value.trim();
    if (!nome) {
      document.getElementById('nome').classList.add('error');
      document.getElementById('nome').focus();
      return;
    }
    localStorage.setItem('nome', nome);
    window.location.href = 'tela2.html';
  }
  document.getElementById('nome').addEventListener('input', function() {
    this.classList.remove('error');
  });
  document.getElementById('nome').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') proximaTela();
  });
</script>
</body>
</html>
