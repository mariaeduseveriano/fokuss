<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Passo 4</title>

  <link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="slide-screen">

  <div class="slide-content">

    <div class="check-circle">

      <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>

    </div>

    <div>

      <h2>
        Pronto,
        <span class="text-green" id="nome-display">...</span>
      </h2>

      <p>
        Confirme suas preferências.
      </p>

    </div>

    <div class="confirm-list">

      <div class="confirm-card">

        <div>

          <span class="confirm-label">
            Nome
          </span>

          <p class="confirm-value" id="conf-nome">
            —
          </p>

        </div>

      </div>

      <div class="confirm-card">

        <div>

          <span class="confirm-label">
            Faixa etária
          </span>

          <p class="confirm-value" id="conf-faixa">
            —
          </p>

        </div>

      </div>

      <div class="confirm-card">

        <div>

          <span class="confirm-label">
            Interesses
          </span>

          <div class="confirm-tags" id="conf-tags"></div>

        </div>

      </div>

    </div>

    <div class="slide-nav">

      <button
        class="btn-back"
        onclick="window.location.href='passo3.html'"
      >
        ← Voltar
      </button>

      <button
        class="btn-start"
        onclick="window.location.href='index.html'"
      >
        Começar →
      </button>

    </div>

  </div>

</div>

<script>

const nome =
  localStorage.getItem('nome') || '—';

const faixa =
  localStorage.getItem('faixa') || '—';

const interesses =
  JSON.parse(
    localStorage.getItem('interesses') || '[]'
  );

document.getElementById('nome-display')
  .textContent = nome;

document.getElementById('conf-nome')
  .textContent = nome;

document.getElementById('conf-faixa')
  .textContent = faixa;

const tags =
  document.getElementById('conf-tags');

interesses.forEach(i => {

  const span = document.createElement('span');

  span.className = 'confirm-tag';

  span.textContent = i;

  tags.appendChild(span);
});

</script>

</body>
</html>
