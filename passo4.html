<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="slide-screen">
  <div class="slide-content">

    <div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="2.2">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>

    <div>
      <h2>Pronto, <span class="text-green" id="nome-display">...</span>!</h2>
      <p>Confirme suas preferências antes de começar.</p>
    </div>

    <div class="confirm-list">
      <div class="confirm-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <div>
          <span class="confirm-label">Nome</span>
          <p class="confirm-value" id="conf-nome">—</p>
        </div>
      </div>

      <div class="confirm-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <line x1="16" y1="2" x2="16" y2="6"/>
          <line x1="8" y1="2" x2="8" y2="6"/>
          <line x1="3" y1="10" x2="21" y2="10"/>
        </svg>
        <div>
          <span class="confirm-label">Faixa etária</span>
          <p class="confirm-value" id="conf-faixa">—</p>
        </div>
      </div>

      <div class="confirm-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="#22C55E" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
        </svg>
        <div>
          <span class="confirm-label">Interesses</span>
          <div class="confirm-tags" id="conf-tags"></div>
        </div>
      </div>
    </div>

    <div class="slide-nav">
      <button class="btn-back" onclick="window.location.href='tela3.html'">← Editar</button>
      <button class="btn-start" onclick="window.location.href='index.html'">Começar agora →</button>
    </div>

  </div>
</div>
<script>
  const nome = localStorage.getItem('nome') || '—';
  const faixa = localStorage.getItem('faixa') || '—';
  const interesses = JSON.parse(localStorage.getItem('interesses') || '[]');

  document.getElementById('nome-display').textContent = nome;
  document.getElementById('conf-nome').textContent = nome;
  document.getElementById('conf-faixa').textContent = faixa;

  const tagsContainer = document.getElementById('conf-tags');
  if (interesses.length === 0) {
    tagsContainer.innerHTML = '<span style="color:var(--text-secondary);font-size:13px">Nenhum selecionado</span>';
  } else {
    interesses.forEach(i => {
      const span = document.createElement('span');
      span.className = 'confirm-tag';
      span.textContent = i;
      tagsContainer.appendChild(span);
    });
  }
</script>
</body>
</html>
