<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Primeiros Passos</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{--bg:#0D1424;--surface:#131C2E;--primary:#22C55E;--text:#F9FAFB;--text-sec:#8B95A8;--border:#1E2A3A;--font:'Segoe UI',sans-serif;--tr:0.22s ease}
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh}
    .screen{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
    .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:28px;width:100%;max-width:540px}
    .icon-ring{width:80px;height:80px;border-radius:50%;background:rgba(34,197,94,.15);border:1.5px solid rgba(34,197,94,.4);display:flex;align-items:center;justify-content:center}
    .icon-ring i{font-size:32px;color:var(--primary)}
    .titles{display:flex;flex-direction:column;gap:10px;align-items:center}
    .titles h1{font-size:34px;font-weight:700;color:var(--text);line-height:1.15;letter-spacing:-.4px}
    .titles h1 em{color:var(--primary);font-style:normal}
    .titles p{font-size:13px;color:var(--text-sec);line-height:1.7;max-width:340px}
    .summary-list{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left}
    .srow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:13px 16px}
    .srow i{font-size:17px;color:var(--primary);flex-shrink:0}
    .srow-label{font-size:11px;color:var(--text-sec)}
    .srow-val{font-size:13px;font-weight:500;color:var(--text)}
    .srow-col{flex-direction:column;align-items:flex-start;gap:8px}
    .srow-top{display:flex;align-items:center;gap:10px}
    .srow-top i{font-size:17px;color:var(--primary)}
    .tags{display:flex;flex-wrap:wrap;gap:5px}
    .tag{font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(34,197,94,.1);color:var(--primary);border:1px solid rgba(34,197,94,.2)}
    .row-actions{display:flex;align-items:center;justify-content:space-between;width:100%}
    .btn-back{background:transparent;border:none;color:var(--text-sec);font-family:var(--font);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;padding:8px 0;transition:color var(--tr)}
    .btn-back:hover{color:var(--text)}
    .btn-back i{font-size:15px}
    .btn-start{padding:14px 32px;background:var(--primary);color:#0B1220;border:none;border-radius:14px;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:all var(--tr)}
    .btn-start:hover{background:#1db852;transform:translateY(-1px)}
    .btn-start:active{transform:scale(.97)}
    .btn-start i{font-size:17px}
  </style>
</head>
<body>
<div class="screen">
  <div class="wrap">
    <div class="icon-ring"><i class="ti ti-circle-check" aria-hidden="true"></i></div>
    <div class="titles">
      <h1>Pronto, <em id="sumName">—</em>!</h1>
      <p>Confirme suas preferências antes de começar.</p>
    </div>
    <div class="summary-list">
      <div class="srow">
        <i class="ti ti-user" aria-hidden="true"></i>
        <div><div class="srow-label">Nome</div><div class="srow-val" id="sName">—</div></div>
      </div>
      <div class="srow">
        <i class="ti ti-calendar" aria-hidden="true"></i>
        <div><div class="srow-label">Faixa etária</div><div class="srow-val" id="sAge">—</div></div>
      </div>
      <div class="srow srow-col">
        <div class="srow-top">
          <i class="ti ti-layout-grid" aria-hidden="true"></i>
          <span class="srow-label">Interesses</span>
        </div>
        <div class="tags" id="sInts"></div>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn-back" onclick="window.location.href='pagina3.html'">
        <i class="ti ti-arrow-left" aria-hidden="true"></i>Editar
      </button>
      <button class="btn-start" onclick="window.location.href='home.html'">
        Começar agora <i class="ti ti-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </div>
</div>
<script>
  const nome = localStorage.getItem('userName') || '—';
  const age  = localStorage.getItem('userAge')  || '—';
  const ints = JSON.parse(localStorage.getItem('userInts') || '[]');

  document.getElementById('sumName').textContent = nome;
  document.getElementById('sName').textContent   = nome;
  document.getElementById('sAge').textContent    = age;
  document.getElementById('sInts').innerHTML     = ints.map(i => `<span class="tag">${i}</span>`).join('');
</script>
</body>
</html>
